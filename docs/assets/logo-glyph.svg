<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="UniConnect logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f2a"/>
      <stop offset="1" stop-color="#0d1017"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6f5e"/>
      <stop offset="1" stop-color="#f23a7a"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb8f5"/>
      <stop offset="1" stop-color="#6fe3ff"/>
    </linearGradient>
  </defs>
  <!-- terminal prompt -->
  <path d="M60 92 L104 128 L60 164" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- chain link = persistent connection -->
  <g fill="none" stroke="url(#link)" stroke-width="16" stroke-linecap="round">
    <path d="M132 150 a26 26 0 0 1 0 -37 l18 -18 a26 26 0 0 1 37 37 l-8 8"/>
    <path d="M186 106 a26 26 0 0 1 0 37 l-18 18 a26 26 0 0 1 -37 -37 l8 -8"/>
  </g>
  <!-- cursor underline -->
  <rect x="120" y="178" width="76" height="14" rx="7" fill="url(#accent)" opacity="0.9"/>
</svg>

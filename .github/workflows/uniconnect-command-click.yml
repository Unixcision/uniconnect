name: UniConnect enlaces y visor lateral

on:
  push:
    branches: [uniconnect, desarrollo/multiplataforma]
    paths:
      - Sources/GhosttyTerminalView.swift
      - Sources/CommandClickFileOpenRouter.swift
      - cmuxUITests/TerminalCmdClickUITests.swift
      - .github/workflows/uniconnect-command-click.yml
  workflow_dispatch:

permissions:
  contents: read

# Compatibilidad de los dos PNG; este caso no reprodujo el fallo comunicado por Dani.
concurrency:
  # Conserva evidencia anterior y actual sin presentar la comparación como un repro.
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  enlaces-en-terminal-real:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CMUX_SKIP_ZIG_BUILD: "1"
      SWIFT_BACKTRACE: "interactive=no,timeout=0s,symbolicate=off,color=no"
      GHOSTTYKIT_DOWNLOAD_RETRIES: "3"
      GHOSTTYKIT_DOWNLOAD_RETRY_DELAY: "5"
    steps:
      - name: Código y submódulos
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Comprobar la versión mayor de Xcode del proyecto
        shell: bash
        run: |
          set -euo pipefail
          expected_major="$(cut -d. -f1 .xcode-version)"
          actual_major="$(xcodebuild -version | awk 'NR == 1 { split($2, version, "."); print version[1] }')"
          xcodebuild -version
          test "$actual_major" = "$expected_major"

      - name: Revisión de Ghostty
        id: ghostty-revision
        run: echo "sha=$(git -C ghostty rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Caché del framework verificado
        id: cache-ghosttykit
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: GhosttyKit.xcframework
          key: uniconnect-ui-ghosttykit-${{ steps.ghostty-revision.outputs.sha }}-${{ hashFiles('scripts/ghosttykit-checksums.txt') }}

      - name: Descargar GhosttyKit con su suma fijada
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Herramientas nativas del proyecto
        run: |
          ./scripts/install-zig-ci.sh
          ./scripts/install-rust-ci.sh

      - name: Caché de dependencias Swift
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .ci-source-packages
          key: uniconnect-ui-spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: uniconnect-ui-spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Habilitar automatización en la máquina de CI
        run: |
          if command -v automationmodetool >/dev/null 2>&1; then
            sudo -n automationmodetool enable-automationmode-without-authentication
          fi

      - name: Preparar las dos revisiones con la misma fixture
        shell: bash
        env:
          FIX_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          baseline=3bcb335d7ac95c8d87874d2ffa64930fa4b745a4
          mkdir -p "$RUNNER_TEMP/uniconnect-command-click/baseline" "$RUNNER_TEMP/uniconnect-command-click/fix"
          cp cmuxUITests/TerminalCmdClickUITests.swift "$RUNNER_TEMP/uniconnect-command-click/fixture.swift"
          cp Sources/AppDelegate.swift "$RUNNER_TEMP/uniconnect-command-click/AppDelegate.swift"
          # The required submodule revisions are already checked out and compared
          # below; fetching unrelated historical submodule commits can fail.
          git -c fetch.recurseSubmodules=false fetch --no-recurse-submodules --depth=1 --no-tags origin "$baseline"
          # Estos insumos deben ser idénticos para compartir framework y cachés.
          git diff --exit-code "$baseline" "$FIX_REVISION" -- \
            ghostty vendor/bonsplit .xcode-version scripts/ghosttykit-checksums.txt \
            cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          # El host de la fixture DEBUG también debe ser idéntico en ambas pruebas.
          # No se permite backportar ningún cambio de producto de AppDelegate.
          BASELINE_REVISION="$baseline" python3 - <<'PY'
          import os, pathlib, subprocess
          path = "Sources/AppDelegate.swift"
          before = subprocess.check_output(["git", "show", os.environ["BASELINE_REVISION"] + ":" + path], text=True)
          current = pathlib.Path(path).read_text()
          start = "#if DEBUG\n    private func setupTerminalCmdClickUITestIfNeeded() {"
          end = "    private func writeTerminalCmdClickUITestData(at path: String, updates: [String: Any]) {"
          def outside_fixture(source):
              assert source.count(start) == 1 and source.count(end) == 1, "Fixture boundaries changed"
              prefix, body = source.split(start, 1)
              fixture, suffix = body.split(end, 1)
              assert "#endif" not in fixture, "Fixture must remain inside DEBUG"
              return prefix, suffix
          assert outside_fixture(before) == outside_fixture(current), "AppDelegate changed outside the DEBUG fixture; review the baseline"
          PY
          git switch --detach "$baseline"
          cp "$RUNNER_TEMP/uniconnect-command-click/fixture.swift" cmuxUITests/TerminalCmdClickUITests.swift
          cp "$RUNNER_TEMP/uniconnect-command-click/AppDelegate.swift" Sources/AppDelegate.swift
          git rev-parse HEAD > "$RUNNER_TEMP/uniconnect-command-click/baseline/revision.txt"
          shasum -a 256 cmuxUITests/TerminalCmdClickUITests.swift Sources/AppDelegate.swift > "$RUNNER_TEMP/uniconnect-command-click/baseline/fixture.sha256"

      - name: Compatibilidad anterior — ambos PNG abren el visor
        id: baseline
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          set +e
          scripts/ci/xcodebuild_noninteractive.py \
            xcodebuild -project cmux.xcodeproj -scheme cmux -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/uniconnect-command-click-dd" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.ci-source-packages" \
            -destination 'platform=macOS' \
            -jobs 2 -parallel-testing-enabled NO \
            -only-testing:cmuxUITests/TerminalCmdClickUITests/testCmdClickPngOpensInCmuxFilePreviewWhenEnabled \
            -only-testing:cmuxUITests/TerminalCmdClickUITests/testCmdClickWrappedPngWithMouseReportingOpensExactFileOnce \
            -resultBundlePath "$RUNNER_TEMP/uniconnect-command-click/baseline/result.xcresult" \
            CMUX_SKIP_ZIG_BUILD=1 \
            test 2>&1 | tee "$RUNNER_TEMP/uniconnect-command-click/baseline/run.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          echo "finished=true" >> "$GITHUB_OUTPUT"
          test "${statuses[0]}" -eq 0
          test "${statuses[1]}" -eq 0
          python3 - <<'PY'
          import os, pathlib, re
          log = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "uniconnect-command-click/baseline/run.log").read_text()
          normal = "testCmdClickPngOpensInCmuxFilePreviewWhenEnabled"
          wrapped = "testCmdClickWrappedPngWithMouseReportingOpensExactFileOnce"
          outcomes = re.findall(r"^Test Case '-\[cmuxUITests\.TerminalCmdClickUITests (\w+)\]' (passed|failed) \(", log, re.M)
          assert len(outcomes) == 2 and dict(outcomes) == {normal: "passed", wrapped: "passed"}, outcomes
          print("Compatibilidad anterior confirmada. Este caso NO reproduce el fallo comunicado.")
          PY

      - name: Compatibilidad actual — ambos PNG pasan con recompilación incremental
        if: ${{ !cancelled() && steps.baseline.outputs.finished == 'true' }}
        timeout-minutes: 35
        shell: bash
        env:
          FIX_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Solo se retira el backport temporal; su copia y hash están guardados.
          git restore --worktree -- cmuxUITests/TerminalCmdClickUITests.swift Sources/AppDelegate.swift
          git switch --detach "$FIX_REVISION"
          cp "$RUNNER_TEMP/uniconnect-command-click/fixture.swift" cmuxUITests/TerminalCmdClickUITests.swift
          cp "$RUNNER_TEMP/uniconnect-command-click/AppDelegate.swift" Sources/AppDelegate.swift
          git rev-parse HEAD > "$RUNNER_TEMP/uniconnect-command-click/fix/revision.txt"
          shasum -a 256 cmuxUITests/TerminalCmdClickUITests.swift Sources/AppDelegate.swift > "$RUNNER_TEMP/uniconnect-command-click/fix/fixture.sha256"
          cmp "$RUNNER_TEMP/uniconnect-command-click/baseline/fixture.sha256" "$RUNNER_TEMP/uniconnect-command-click/fix/fixture.sha256"
          scripts/ci/xcodebuild_noninteractive.py \
            xcodebuild -project cmux.xcodeproj -scheme cmux -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/uniconnect-command-click-dd" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.ci-source-packages" \
            -destination 'platform=macOS' \
            -jobs 2 -parallel-testing-enabled NO \
            -only-testing:cmuxUITests/TerminalCmdClickUITests/testCmdClickPngOpensInCmuxFilePreviewWhenEnabled \
            -only-testing:cmuxUITests/TerminalCmdClickUITests/testCmdClickWrappedPngWithMouseReportingOpensExactFileOnce \
            -resultBundlePath "$RUNNER_TEMP/uniconnect-command-click/fix/result.xcresult" \
            CMUX_SKIP_ZIG_BUILD=1 \
            test 2>&1 | tee "$RUNNER_TEMP/uniconnect-command-click/fix/run.log"
          python3 - <<'PY'
          import os, pathlib, re
          log = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "uniconnect-command-click/fix/run.log").read_text()
          outcomes = re.findall(r"^Test Case '-\[cmuxUITests\.TerminalCmdClickUITests (\w+)\]' (passed|failed) \(", log, re.M)
          expected = {"testCmdClickPngOpensInCmuxFilePreviewWhenEnabled": "passed",
                      "testCmdClickWrappedPngWithMouseReportingOpensExactFileOnce": "passed"}
          assert len(outcomes) == 2 and dict(outcomes) == expected, outcomes
          print("Arreglo validado: los dos clics reales abren el visor correcto.")
          PY

      - name: Conservar evidencia del baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uniconnect-command-click-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/uniconnect-command-click/baseline/
          if-no-files-found: warn
          retention-days: 7

      - name: Conservar evidencia del arreglo
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uniconnect-command-click-fix-${{ github.sha }}
          path: ${{ runner.temp }}/uniconnect-command-click/fix/
          if-no-files-found: warn
          retention-days: 7

name: UniConnect creación de ventanas por RPC

on:
  push:
    branches: [uniconnect, desarrollo/multiplataforma]
    paths:
      - Sources/TerminalController.swift
      - Sources/Workspace.swift
      - Sources/UniConnect/**
      - cmuxTests/MobileWorkspaceListFidelityTests.swift
      - cmux.xcodeproj/**
      - ghostty
      - scripts/download-prebuilt-ghosttykit.sh
      - scripts/ghosttykit-checksums.txt
      - scripts/ci/xcodebuild_noninteractive.py
      - .github/workflows/uniconnect-macos-rpc.yml
  workflow_dispatch:

permissions:
  contents: read

# Conserva ambos resultados de la secuencia de regresión: prueba roja y arreglo verde.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  creacion-local-real:
    runs-on: macos-26
    timeout-minutes: 50
    env:
      CMUX_SKIP_ZIG_BUILD: "1"
      SWIFT_BACKTRACE: "interactive=no,timeout=0s,symbolicate=off,color=no"
      GHOSTTYKIT_DOWNLOAD_RETRIES: "3"
      GHOSTTYKIT_DOWNLOAD_RETRY_DELAY: "5"
    steps:
      - name: Código y submódulos
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Comprobar la versión mayor de Xcode del proyecto
        shell: bash
        run: |
          set -euo pipefail
          expected_major="$(cut -d. -f1 .xcode-version)"
          actual_major="$(xcodebuild -version | awk 'NR == 1 { split($2, version, "."); print version[1] }')"
          xcodebuild -version
          test "$actual_major" = "$expected_major"

      - name: Revisión de Ghostty
        id: ghostty-revision
        run: echo "sha=$(git -C ghostty rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Caché del framework verificado
        id: cache-ghosttykit
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: GhosttyKit.xcframework
          key: uniconnect-rpc-ghosttykit-${{ steps.ghostty-revision.outputs.sha }}-${{ hashFiles('scripts/ghosttykit-checksums.txt') }}

      - name: Descargar GhosttyKit con su suma fijada
        if: steps.cache-ghosttykit.outputs.cache-hit != 'true'
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Herramientas nativas del proyecto
        run: |
          ./scripts/install-zig-ci.sh
          ./scripts/install-rust-ci.sh

      - name: Caché de dependencias Swift
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .ci-source-packages
          key: uniconnect-rpc-spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: uniconnect-rpc-spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Ejecutar solo la suite de creación y fidelidad móvil
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          scripts/ci/xcodebuild_noninteractive.py \
            xcodebuild -project cmux.xcodeproj -scheme cmux-unit -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/uniconnect-mobile-rpc-dd" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/.ci-source-packages" \
            -destination 'platform=macOS' \
            -jobs 2 -parallel-testing-enabled NO \
            -only-testing:cmuxTests/MobileWorkspaceListFidelityTests \
            -resultBundlePath "$RUNNER_TEMP/uniconnect-mobile-rpc.xcresult" \
            CMUX_SKIP_ZIG_BUILD=1 \
            test 2>&1 | tee "$RUNNER_TEMP/uniconnect-mobile-rpc.log"

      - name: Conservar resultados y registro de la ejecución
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uniconnect-mobile-rpc-${{ github.sha }}
          path: |
            ${{ runner.temp }}/uniconnect-mobile-rpc.xcresult
            ${{ runner.temp }}/uniconnect-mobile-rpc.log
          if-no-files-found: warn
          retention-days: 7
